name: Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  schedule:
    - cron: '0 2 * * *'  # Runs at 2:00 AM UTC every day

jobs:
  unit-tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: continuous_integration/environment-ci.yml
          environment-name: cmac_test_env
          create-args: >-
            python=${{ matrix.python-version }}
          cache-environment: true

      - name: Install cmac
        run: pip install --no-deps -e .

      - name: Run unit tests
        run: pytest -v cmac/tests/
